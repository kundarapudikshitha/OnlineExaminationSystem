<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="container">

        <h1>Student Dashboard</h1>

        <h2>
            Welcome, <span th:text="${student.name}"></span>!
        </h2>

        <p>
            Email:
            <span th:text="${student.email}"></span>
        </p>

        <h3>Student Menu</h3>

        <a href="/available-exams" class="btn">Available Exams</a>

        <a href="/my-results" class="btn">My Results</a>

        <br><br>

        <a href="/logout" class="btn">Logout</a>

    </div>

</body>
</html>
