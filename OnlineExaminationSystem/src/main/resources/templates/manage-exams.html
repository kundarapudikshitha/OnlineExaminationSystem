<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Exams</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Manage Exams</h1>
    <p>View and manage all examinations.</p>

    <a href="/admin/create-exam" class="btn">
        Create New Exam
    </a>

    <br><br>

    <table border="1" cellpadding="10"
           style="width:100%; border-collapse:collapse;">

        <thead>
            <tr>
                <th>ID</th>
                <th>Exam Title</th>
                <th>Description</th>
                <th>Duration</th>
                <th>Total Marks</th>
                <th>Actions</th>
                <th>Questions</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="exam : ${exams}">

                <td th:text="${exam.id}"></td>

                <td th:text="${exam.title}"></td>

                <td th:text="${exam.description}"></td>

                <td th:text="${exam.durationMinutes} + ' minutes'"></td>

                <td th:text="${exam.totalMarks}"></td>

                <td>
                    <a th:href="@{/admin/edit-exam/{id}(id=${exam.id})}">
                        Edit
                    </a>

                    |

                    <form th:action="@{/admin/delete-exam/{id}(id=${exam.id})}"
                          method="post"
                          style="display:inline;"
                          onsubmit="return confirm('Are you sure you want to delete this exam?');">

                        <button type="submit">
                            Delete
                        </button>

                    </form>
                </td>

                <td>
                    <a th:href="@{/admin/manage-questions/{examId}(examId=${exam.id})}">
                        Manage Questions
                    </a>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(exams)}">
                <td colspan="7">No exams available.</td>
            </tr>

        </tbody>

    </table>

    <br>

    <a href="/admin/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
