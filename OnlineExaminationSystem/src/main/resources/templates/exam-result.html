
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Examination Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>Examination Result</h1>

    <h2 th:text="${exam.title}">Exam Title</h2>

    <hr>

    <h3>Your Performance</h3>

    <p>
        Obtained Marks:
        <strong th:text="${score}">0</strong>
    </p>

    <p>
        Total Marks:
        <strong th:text="${totalMarks}">0</strong>
    </p>

    <p>
        Percentage:
        <strong th:text="${#numbers.formatDecimal(percentage, 1, 2)} + '%'">
            0%
        </strong>
    </p>

    <h2>
        Result:
        <span th:text="${status}"
              th:style="${status == 'Pass'} ?
              'color: green;' : 'color: red;'">
            Result Status
        </span>
    </h2>

    <hr>

    <a th:href="@{/my-results}" class="btn">
        View My Results
    </a>

    <a th:href="@{/dashboard}" class="btn">
        Back to Dashboard
    </a>

</div>

</body>
</html>
